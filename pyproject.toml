[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",     # we don't annotate
    "CPY",  # no copyright
    "D",       # no docstring policy
    "ARG001",  # unused function argument, `request` in every view
    "ARG002",  # unused method argument, django hook signatures
    "DJ001",   # null=True on string fields, deliberate here
    "DJ012",   # `__str__` and Meta before the fields
    "ERA001",  # commented out code we keep around as a reference
    "PLC0415", # `import` should be at the top-level of a file
    "PLR2004", # magic-value-comparison
    "PT009",   # Use a regular `assert` instead of unittest-style `{assertion}`
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "S308",    # Use of `mark_safe` may expose cross-site scripting vulnerabilities
    "SLF001",  # private member access, `_meta` is public API in practice
]

# Ignore `E501` (line length) in all `__init__.py`  and migration files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E501"]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cam_archive.settings"
# -- recommended but optional:
python_files = "tests.py"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "./manage.py",
    "**/*migrations*/*",
    "cam_archive/wsgi.py",
    "cam_archive/asgi.py",
    "cam_archive/settings.py",
]
